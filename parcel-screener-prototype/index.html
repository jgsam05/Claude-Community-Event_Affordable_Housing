<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OCA · Affordable housing site screener for Orange County</title>
  <meta name="description" content="OCA ranks parcels in an Orange County ZIP code that could work for new affordable housing or for keeping existing affordable homes. Free public data, with sources and confidence for every score.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="#/" aria-label="OCA home">
      <svg class="logo" width="40" height="40" viewBox="0 0 48 48" aria-hidden="true"><polygon points="3,5 22,3 23,21 4,23" fill="#2B5FC7" fill-opacity="0.45" stroke="#2B5FC7" stroke-width="1.6" stroke-linejoin="round"/><polygon points="26,4 45,6 44,24 25,22" fill="#E8A800" fill-opacity="0.45" stroke="#E8A800" stroke-width="1.6" stroke-linejoin="round"/><polygon points="4,27 23,26 21,45 5,43" fill="#12844A" fill-opacity="0.45" stroke="#12844A" stroke-width="1.6" stroke-linejoin="round"/><polygon points="27,25 44,28 43,44 24,46" fill="#C2490F" fill-opacity="0.45" stroke="#C2490F" stroke-width="1.6" stroke-linejoin="round"/><circle cx="13" cy="13" r="4.5" fill="#2B5FC7" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="35" cy="14" r="4.5" fill="#E8A800" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="13" cy="35" r="4.5" fill="#12844A" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="34" cy="36" r="4.5" fill="#C2490F" stroke="#FFFFFF" stroke-width="1.6"/></svg>
      <span class="wordmark">OCA</span>
    </a>
    <div id="header-context" class="header-context"></div>
    <nav class="site-nav" aria-label="Main">
      <a href="#/how" data-route="how">How to use OCA</a>
      <a href="#/methods" data-route="methods">Sources &amp; methods</a>
    </nav>
    <form id="header-zip" class="header-zip" novalidate>
      <label for="hzip">Orange County ZIP code</label>
      <div class="zip-row">
        <input id="hzip" type="text" inputmode="numeric" autocomplete="postal-code" maxlength="5" placeholder="e.g. 92705">
        <button class="btn-primary" type="submit">Find sites</button>
      </div>
    </form>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="site-footer">
    <span>OCA is a screening tool, not a feasibility study.</span>
    <span>Zoning isn’t included yet.</span>
    <span>Always confirm zoning and ownership before acting.</span>
    <a href="#/methods">Sources &amp; methods</a>
  </footer>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
